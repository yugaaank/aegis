[project]
name = "aegis"
version = "1.0.0"
description = "Space debris collision risk estimator"
authors = [
    { name = "yugaaank", email = "yugaankrathore0@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "scipy>=1.18.1",
    "uvicorn>=0.53.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
